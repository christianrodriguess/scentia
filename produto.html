<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scentia</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
</head>

<body>
    <header class="cabecalho">
        <div class="logotipo">
            <a href="index.html">
                <img src="img/logotipoScentia.png" alt="Logotipo Scentia" width="75" height="75">
            </a>
            <h1>
                <a href="index.html">SCENTIA</a>
            </h1>
        </div>
        <div class="barra-busca">
            <input type="search" id="busca" name="busca" placeholder="O que você procura?">
            <button type="submit">
                <img src="img/pesquisar.svg" alt="Pesquisar" width="20" height="20">
            </button>
        </div>
        <div class="acoes-cabecalho">
            <a href="compras.html">
                <img src="img/carrinho.svg" alt="Carrinho" width="30" height="30">
            </a>
            <a href="">
                <img src="img/usuario.svg" alt="Fazer login" width="30" height="30">
            </a>
        </div>
    </header>

    



    <footer class="rodape">
        <div class="links-uteis">
            <div>
                <h3>Scentia</h3>
                <ul>
                    <li><a href="">Trabalhe conosco</a></li>
                    <li><a href="">Sustentabilidade</a></li>
                </ul>
            </div>
            <div>
                <h3>Atendimento</h3>
                <ul>
                    <li><a href="">Perguntas frequentes</a></li>
                    <li><a href="">Contato</a></li>
                    <li><a href="">Ouvidoria</a></li>
                </ul>
            </div>
            <div>
                <h3>Suporte</h3>
                <ul>
                    <li><a href="">Política de privacidade</a></li>
                    <li><a href="">Trocas e devoluções</a></li>
                </ul>
            </div>
        </div>
        <div class="informacoes-rodape">
            <div>
                <h3>Meios de Pagamento</h3>
                <div class="meios-pagamento">
                    <img src="img/elo.png" alt="Elo">
                    <img src="img/mastercard.png" alt="Mastercard">
                    <img src="img/visa.png" alt="Visa">
                    <img src="img/boleto.png" alt="Boleto">
                    <img src="img/pix.png" alt="Pix">
                </div>
            </div>
            <div>
                <h3>Siga-nos nas redes sociais</h3>
                <div class="redes-sociais">
                    <a href="">
                        <img src="img/facebook.svg" alt="Facebook">
                    </a>
                    <a href="">
                        <img src="img/instagram.svg" alt="Instagram">
                    </a>
                    <a href="">
                        <img src="img/youtube.svg" alt="Youtube">
                    </a>
                    <a href="">
                        <img src="img/x-twitter.svg" alt="X">
                    </a>
                </div>
            </div>
        </div>
        <div class="copyright">
            <small>© Scentia. Todos os direitos reservados.</small>
        </div>
    </footer>
</body>

</html>
